<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
</head>
<body>
    <form action="" method="post" enctype="">
        <fieldset>
            <legend>Login Form</legend>
            <H2 align="center">Login Your Account</H2>
            <div>
                <label for="name">Your Name: </label>
                <input type="name" ip="name" placeholder="Enter your name!!" min="4" max="15" required>
            </div>
            <div>
                  <p></p>
            </div>
            <div>
                <label for="Password">Your Password: </label>
                <input type="password" ip="password" >
            </div>
            <div>
                  <p></p>
            </div>
            <div>
            <label for="re">Rember me:</label>
            <input name="re" type="checkbox" >
            </div>
            <button name="button">Login</button>
            <button name="cancel">cancel</button>
        </fieldset>
    </form>
</body>
</html>
